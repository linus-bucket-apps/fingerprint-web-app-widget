<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="referrer" content="no-referrer">
    <title>Image classifier</title>
    <link rel="stylesheet" href="./widget.css">
    <script src="./widget.js" defer></script>
  </head>
  <body>
    <main class="widget-shell">
      <section class="widget-card" aria-label="Image classifier">
        <label id="drop-zone" class="drop-zone" for="image-input">
          <svg class="upload-icon" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="7" y="8" width="34" height="32" rx="5"></rect>
            <path d="m13 33 8-9 6 6 4-4 4 7"></path>
            <circle cx="18" cy="17" r="3"></circle>
          </svg>
          <span class="sr-only">Choose or drop an image to classify</span>
        </label>
        <input
          id="image-input"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif,image/bmp"
          disabled
        >

        <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span class="sr-only">Classifying image</span>
        </div>

        <section id="result-panel" class="result-panel" aria-live="polite" hidden>
          <p id="result-label" class="result-label"></p>
          <a id="view-result" class="result-link" target="_blank" rel="noopener" hidden>View your result</a>
        </section>

        <div id="error-panel" class="error-panel" role="alert" hidden>
          <p id="error-message"></p>
          <button id="retry-button" type="button" hidden>Retry</button>
        </div>
      </section>
    </main>

    <noscript>This image classifier needs JavaScript to run.</noscript>
  </body>
</html>
